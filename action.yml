name: 'Agentic Code Sec Reviewer'
description: '该Agent首先使用codeql等工具对PR中的代码进行安全扫描，然后使用多智能体系统对扫描结果进行研判，并将真正的安全问题以评论的形式反馈到PR中。'
author: 'lnjoy'

inputs:
  # === 基础与核心配置 ===
  github_token:
    description: '用于发表 PR 评论和获取代码 (Required)'
    required: true
  log_level:
    description: '日志级别 (DEBUG, INFO, WARNING, ERROR)'
    required: false
    default: 'INFO'
  github_timeout:
    description: 'GitHub API 请求超时时间'
    required: false
    default: '30'
  github_max_retries:
    description: 'GitHub API 请求最大重试次数'
    required: false
    default: '3'

  # === 大模型基础配置 ===
  llm_model_name:
    description: '大语言模型名称'
    required: false
    default: 'Qwen3-Coder-30B-A3B-Instruct-FP8'
  llm_base_url:
    description: '大语言模型 API 基础路径'
    required: false
    default: 'http://i-1.gpushare.com:6250/v1'
  llm_api_key:
    description: '大语言模型 API Key'
    required: false
    default: 'token-is-not-needed'

  # === Agent 与 Context 配置 ===
  agent_max_rounds:
    description: 'Agent 最大行动轮数'
    required: false
    default: '30'
  max_critical_rounds:
    description: '批判节点的最大审查轮数'
    required: false
    default: '3'
  scan_context_max_lines:
    description: 'LLM 扫描器的单次扫描上下文最大行数'
    required: false
    default: '500'
  retrieval_context_max_lines:
    description: '代码检索器的检索上下文最大行数'
    required: false
    default: '200'

  # === 各角色 Temperature & Top_p 参数 ===
  scanner_temperature:
    description: 'Scanner 角色的 temperature'
    required: false
    default: '0.33'
  scanner_top_p:
    description: 'Scanner 角色的 top_p'
    required: false
    default: '0.81'

  router_temperature:
    description: 'Router 角色的 temperature'
    required: false
    default: '0.1'
  router_top_p:
    description: 'Router 角色的 top_p'
    required: false
    default: '0.36'

  injection_expert_temperature:
    description: 'Injection_Expert 角色的 temperature'
    required: false
    default: '0.14'
  injection_expert_top_p:
    description: 'Injection_Expert 角色的 top_p'
    required: false
    default: '0.62'

  data_asset_expert_temperature:
    description: 'Data_Asset_Expert 角色的 temperature'
    required: false
    default: '0.14'
  data_asset_expert_top_p:
    description: 'Data_Asset_Expert 角色的 top_p'
    required: false
    default: '0.62'

  infra_supply_expert_temperature:
    description: 'Infra_Supply_Expert 角色的 temperature'
    required: false
    default: '0.14'
  infra_supply_expert_top_p:
    description: 'Infra_Supply_Expert 角色的 top_p'
    required: false
    default: '0.62'

  logic_identity_expert_temperature:
    description: 'Logic_Identity_Expert 角色的 temperature'
    required: false
    default: '0.2'
  logic_identity_expert_top_p:
    description: 'Logic_Identity_Expert 角色的 top_p'
    required: false
    default: '0.7'

  general_expert_temperature:
    description: 'General_Expert 角色的 temperature'
    required: false
    default: '0.4'
  general_expert_top_p:
    description: 'General_Expert 角色的 top_p'
    required: false
    default: '0.87'

  critic_temperature:
    description: 'Critic 角色的 temperature'
    required: false
    default: '0.12'
  critic_top_p:
    description: 'Critic 角色的 top_p'
    required: false
    default: '0.45'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install python dependencies
      shell: bash
      run: |
        echo "$(date) - Installing Python dependencies..."
        pip install -r ${{ github.action_path }}/requirements.txt

    - name: Install Trivy
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        echo "$(date) - Installing Trivy..."
        VERSION=$(curl -s -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/aquasecurity/trivy/releases/latest | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
        echo "Found latest version: v${VERSION}"
        wget -q https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz
        tar -zxf trivy_${VERSION}_Linux-64bit.tar.gz
        mv trivy /usr/local/bin/

    - name: Install Gitleaks
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        echo "$(date) - Installing Gitleaks..."
        VERSION=$(curl -s -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
        wget -q https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz
        tar -zxf gitleaks_${VERSION}_linux_x64.tar.gz
        sudo mv gitleaks /usr/local/bin/

    - name: Install Semgrep
      shell: bash
      run: |
        echo "$(date) - Installing Semgrep..."
        python3 -m pip install semgrep

    - name: Install ripgrep
      shell: bash
      run: |
        echo "$(date) - Installing ripgrep..."
        sudo apt-get update -qq && sudo apt-get install -y ripgrep

    - name: Get Date
      shell: bash
      id: get-date
      run: echo "date=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT

    - name: Cache Trivy DB
      uses: actions/cache@v4
      with:
        path: /home/runner/.cache/trivy
        key: ${{ runner.os }}-trivy-db-${{ steps.get-date.outputs.date }}
        restore-keys: |
          ${{ runner.os }}-trivy-db-

    - name: Run code review
      shell: bash
      env:
        # GitHub 默认上下文
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        
        # Action Inputs 映射
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GITHUB_TIMEOUT: ${{ inputs.github_timeout }}
        GITHUB_MAX_RETRIES: ${{ inputs.github_max_retries }}
        LOG_LEVEL: ${{ inputs.log_level }}
        
        # 核心配置参数同步
        LLM_MODEL_NAME: ${{ inputs.llm_model_name }}
        LLM_BASE_URL: ${{ inputs.llm_base_url }}
        LLM_API_KEY: ${{ inputs.llm_api_key }}
        AGENT_MAX_ROUNDS: ${{ inputs.agent_max_rounds }}
        MAX_CRITICAL_ROUNDS: ${{ inputs.max_critical_rounds }}
        SCAN_CONTEXT_MAX_LINES: ${{ inputs.scan_context_max_lines }}
        RETRIEVAL_CONTEXT_MAX_LINES: ${{ inputs.retrieval_context_max_lines }}

        # 各角色配置同步
        ROLE_SCANNER_TEMP: ${{ inputs.scanner_temperature }}
        ROLE_SCANNER_TOP_P: ${{ inputs.scanner_top_p }}
        ROLE_ROUTER_TEMP: ${{ inputs.router_temperature }}
        ROLE_ROUTER_TOP_P: ${{ inputs.router_top_p }}
        ROLE_INJECTION_TEMP: ${{ inputs.injection_expert_temperature }}
        ROLE_INJECTION_TOP_P: ${{ inputs.injection_expert_top_p }}
        ROLE_DATA_ASSET_TEMP: ${{ inputs.data_asset_expert_temperature }}
        ROLE_DATA_ASSET_TOP_P: ${{ inputs.data_asset_expert_top_p }}
        ROLE_INFRA_SUPPLY_TEMP: ${{ inputs.infra_supply_expert_temperature }}
        ROLE_INFRA_SUPPLY_TOP_P: ${{ inputs.infra_supply_expert_top_p }}
        ROLE_LOGIC_IDENTITY_TEMP: ${{ inputs.logic_identity_expert_temperature }}
        ROLE_LOGIC_IDENTITY_TOP_P: ${{ inputs.logic_identity_expert_top_p }}
        ROLE_GENERAL_TEMP: ${{ inputs.general_expert_temperature }}
        ROLE_GENERAL_TOP_P: ${{ inputs.general_expert_top_p }}
        ROLE_CRITIC_TEMP: ${{ inputs.critic_temperature }}
        ROLE_CRITIC_TOP_P: ${{ inputs.critic_top_p }}
        
      run: |
        echo "$(date) - Starting Agentic Code Sec Reviewer..."
        python ${{ github.action_path }}/main.py