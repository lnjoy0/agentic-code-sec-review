name: 'Agentic Code Sec Reviewer'
description: '该Agent首先使用codeql等工具对PR中的代码进行安全扫描，然后使用基于RAG的多智能体系统对扫描结果进行研判，并将真正的安全问题以评论的形式反馈到PR中。'
author: 'lnjoy'

inputs:
  github_token:
    description: '用于发表 PR 评论'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install python dependencies
      shell: bash
      run: |
        echo "$(date)"
        pip install -r ${{ github.action_path }}/requirements.txt
        echo "$(date)"

    - name: Install Trivy
      shell: bash
      run: |
        echo "Installing Trivy..."
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
        echo "$(date)"

    - name: Install Gitleaks
      shell: bash
      run: |
        echo "Installing Gitleaks..."
        VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
        wget https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz
        tar -zxvf gitleaks_${VERSION}_linux_x64.tar.gz
        sudo mv gitleaks /usr/local/bin/
        echo "$(date)"

    - name: Install Semgrep
      shell: bash
      run: |
        echo "Installing Semgrep..."
        python3 -m pip install semgrep
        echo "$(date)"

    - name: Install ripgrep
      shell: bash
      run: |
        sudo apt-get install -y ripgrep
        echo "$(date)"

    - name: Get Date
      shell: bash
      id: get-date
      run: echo "date=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT

    - name: Cache Trivy DB
      uses: actions/cache@v3
      with:
        path: /home/runner/.cache/trivy
        key: ${{ runner.os }}-trivy-db-${{ steps.get-date.outputs.date }}
        restore-keys: |
          ${{ runner.os }}-trivy-db-

    - name: Run code review
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        ACTION_DIR: ${{ github.action_path }}
      run: |
        echo "$(date)"
        python ${{ github.action_path }}/main.py